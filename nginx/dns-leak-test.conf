# nginx/dns-leak-test.conf
#
# Nginx je JEDINA javna HTTP/HTTPS tacka. Express (127.0.0.1:3000) se NE
# izlaze direktno internetu. DNS (port 53) ide MIMO nginx-a - nginx ne moze
# da proksira sirov DNS protokol na ovaj nacin.

server {
    listen 80;
    listen [::]:80;
    server_name test.tvojdomen.com;

    # Preusmeri sve na HTTPS - servis mora biti HTTPS-only u produkciji.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name test.tvojdomen.com;

    ssl_certificate     /etc/letsencrypt/live/test.tvojdomen.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test.tvojdomen.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # HSTS - ukljuci TEK nakon sto potvrdis da HTTPS stabilno radi.
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Ogranici velicinu tela zahteva - API prima male JSON payload-e.
    client_max_body_size 4k;

    # Razumni timeout-i - sprecavaju da spori/zlonamerni klijenti drze konekcije otvorene.
    proxy_connect_timeout 5s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;

    # --- Pristupni logovi: NAMERNO ISKLJUCENI (privacy-preserving default) ---
    # Aplikacija tvrdi da cuva podatke o sesiji ~180 sekundi. Ako nginx
    # istovremeno trajno beleži IP adrese posetilaca u access_log, ta tvrdnja
    # je netacna u praksi. Biraj JEDNU od dve opcije ispod - ne obe.
    access_log off;

    # ALTERNATIVA ako je bezbednosno logovanje potrebno: kratka, dokumentovana
    # retencija (npr. logrotate sa par dana) i azuriraj Privacy Notice da
    # to tacno odrazava:
    # access_log /var/log/nginx/dns-leak-test.access.log combined;

    error_log /var/log/nginx/dns-leak-test.error.log warn;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
